[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "co2_eor"
version = "0.1.0"
description = "models for co2 eor optimization"
requires-python = ">=3.14"
dependencies = [
    "pyomo",
    "idaes-pse[ui]",
    "numpy",
    "pandas",
    "readchar",
    "IPython",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.9.1",
    "cvxpy>=1.9.3",
    "tensorflow>=2.22.0rc0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.uv.sources]
idaes-pse = { git = "https://github.com/cwhillock-cmu/idaes-pse", branch = "main" }
